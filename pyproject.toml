[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-ai-agent"
version = "0.1.0"
description = "Grounded customer-service agent for Empório da Música"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
include = ["emporio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
